name: Android build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned: AGP 8.7.3 needs Gradle 8.9+ and is not compatible with Gradle 9.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        env:
          # Public client key (publishable). Add it under Settings > Secrets and variables > Actions.
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # On failure, print the real cause at the top of the run page (Summary), no log digging needed.
      - name: Summarize build errors
        if: failure()
        run: |
          {
            echo "## Build errors (copy this)"
            echo '```'
            grep -E "^e: " build.log | head -40 || true
            sed -n '/What went wrong/,/Try:/p' build.log | head -30 || true
            grep -E "AAPT|error:" build.log | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sonic-remote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
